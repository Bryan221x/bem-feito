<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="referrer" content="no-referrer" /><title>Ativar conta | Bem-Feito</title><link rel="stylesheet" href="../css/reset.css" /><link rel="stylesheet" href="../css/variables.css" /><link rel="stylesheet" href="../css/global.css" /><link rel="stylesheet" href="../css/components/buttons.css" /><link rel="stylesheet" href="../css/pages/institution-login.css" /><link rel="stylesheet" href="../css/pages/account-activation.css" /></head>
<body class="institution-login-page"><a class="skip-link" href="#main-content">Pular para o conteúdo principal</a><main id="main-content" class="activation-page" data-account-activation-page><section class="activation-card"><a class="institution-login__brand" href="../index.html"><img class="institution-login__brand-mark" src="../assets/images/brand/brand-mark.png" alt="" /><span class="institution-login__brand-name">Bem-Feito</span></a><h1>Ativar sua conta</h1><p role="status" aria-live="polite" data-activation-message>Verificando convite…</p><form class="institution-login__form" data-activation-form hidden><p>Crie uma senha com pelo menos 12 caracteres e no máximo 72 bytes UTF-8.</p><div class="institution-login__field"><label for="activation-password">Nova senha</label><input class="institution-login__input" id="activation-password" name="password" type="password" autocomplete="new-password" minlength="12" required /></div><div class="institution-login__field"><label for="activation-confirm">Confirme a senha</label><input class="institution-login__input" id="activation-confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required /></div><button class="button button--primary" type="submit">Ativar conta</button></form><a class="button button--outline" href="./institution-login.html" data-activation-login hidden>Entrar na conta</a></section></main><script type="module" src="../js/pages/account-activation.js"></script></body></html>
