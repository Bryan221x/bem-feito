<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar senha | Bem-Feito</title><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components/buttons.css"><link rel="stylesheet" href="../css/pages/institution-login.css"><link rel="stylesheet" href="../css/pages/account-activation.css"></head>
<body><main class="activation-page"><section class="activation-card" data-password-recovery><h1>Recuperar senha</h1><p role="status" aria-live="polite" data-recovery-message>Informe seu e-mail. Se a conta for elegível e o envio estiver disponível, enviaremos um link temporário.</p><form class="institution-login__form" data-recovery-request><label>E-mail<input class="institution-login__input" name="email" type="email" autocomplete="email" maxlength="255" required></label><button class="button button--primary" type="submit">Solicitar recuperação</button></form><form class="institution-login__form" data-recovery-reset hidden><p>Use pelo menos 12 caracteres e no máximo 72 bytes UTF-8.</p><label>Nova senha<input class="institution-login__input" name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Confirmar nova senha<input class="institution-login__input" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label><button class="button button--primary" type="submit">Redefinir senha</button></form><p><a href="./institution-login.html">Voltar para entrar</a></p><p><a href="./password-recovery.html">Solicitar outro link</a></p></section></main><script type="module" src="../js/pages/password-recovery.js"></script></body></html>
