name: bemfeito
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"
services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bem_feito
      MYSQL_USER: bemfeito
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD outside the repository}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD outside the repository}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./database/reference-data.sql:/docker-entrypoint-initdb.d/20-reference.sql:ro
      - ./database/cities.sql:/docker-entrypoint-initdb.d/30-cities.sql:ro
      - ./deploy/40-restrict-app.sql:/docker-entrypoint-initdb.d/40-restrict-app.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --user="$$MYSQL_USER" --database=bem_feito --batch --skip-column-names --execute="SELECT COUNT(*) = 5571 FROM cities" | grep -qx 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging: *logging
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/bem_feito?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      DB_USER: bemfeito
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD outside the repository}
      APP_FRONTEND_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      APP_CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      APP_UPLOAD_DIR: /var/lib/bemfeito/uploads
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_SMTP_STARTTLS: ${APP_SMTP_STARTTLS:-true}
      APP_SMTP_SSL: ${APP_SMTP_SSL:-false}
      TZ: America/Sao_Paulo
    volumes: [uploads:/var/lib/bemfeito/uploads]
    networks: [database, web]
    depends_on:
      mysql: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *logging
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]
    networks: [web]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
networks:
  database: {internal: true}
  web: {}
volumes:
  mysql_data: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}
