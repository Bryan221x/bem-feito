spring.application.name=bem-feito-api

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/bem_feito?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=8080

# Contratos de escrita rejeitam campos desconhecidos e enums numéricos.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# Sessão HTTP e origens explícitas do frontend.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${APP_SESSION_COOKIE_SAME_SITE:lax}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}

# Parte 4. Nenhum segredo ou token bruto deve ser salvo em arquivos.
app.invitation.ttl=${APP_INVITATION_TTL:48h}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://127.0.0.1:5500}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

app.upload.dir=${APP_UPLOAD_DIR:${user.home}/.bem-feito/uploads}
app.upload.max-bytes=${APP_UPLOAD_MAX_BYTES:5242880}
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_BYTES:5242880}B
spring.servlet.multipart.max-request-size=${APP_UPLOAD_REQUEST_MAX_BYTES:6291456}B
