# Same-origin HTTPS behind the private reverse proxy. No development credentials.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=native
server.shutdown=graceful
server.tomcat.max-http-form-post-size=1MB
server.max-http-request-header-size=16KB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.frontend-base-url=${APP_FRONTEND_BASE_URL}
app.upload.dir=${APP_UPLOAD_DIR}
app.bootstrap-admin.enabled=false
app.abuse-protection.enabled=true
spring.mail.properties.mail.smtp.auth=${APP_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${APP_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${APP_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${APP_SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
