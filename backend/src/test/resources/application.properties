spring.datasource.url=jdbc:h2:mem:bemfeito-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:reference-schema.sql
spring.sql.init.data-locations=classpath:reference-fixtures.sql
